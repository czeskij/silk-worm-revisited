# Deploys the remake's code to the Cloudflare Worker on every push to main.
# The game data isn't in the repo: it stays in the Worker's private KV store
# (uploaded once with deploy/setup.js). Needs the repository secret
# CLOUDFLARE_API_TOKEN (see deploy/README.md).
name: Deploy remake

on:
  push:
    branches: [main]
    paths: ["remake/**", "deploy/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/package-lock.json
      - run: npm ci
      - name: Check the one-time setup was done
        id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if grep -q SET_BY_SETUP wrangler.jsonc; then
            echo "::notice::Not deployed: run 'node setup.js' in deploy/ once and commit wrangler.jsonc"
          elif [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Not deployed: add the CLOUDFLARE_API_TOKEN repository secret"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 23144c9591362ca84e7b580c4679bdf3
