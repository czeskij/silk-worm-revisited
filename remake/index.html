<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silkworm Revisited</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b10; --fg: #ddd; --accent: #ffe066; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 15px/1.5 system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: none; }
  #box { position: relative; line-height: 0; }
  /* optional CRT look (C): a dark line under every Amiga row, like a PAL
     monitor or an emulator's scanline filter; the original itself has none */
  #crt { position: absolute; inset: 0; pointer-events: none; display: none;
         background: repeating-linear-gradient(to bottom, transparent 0 50%, rgba(0,0,0,.4) 50% 100%); }
  #crt.on { display: block; }
  #missing { max-width: 34em; padding: 0 16px; text-align: center; display: none; }
  #missing h1 { color: var(--accent); font-size: 1.6em; margin-bottom: .2em; }
  code { color: var(--accent); }
</style>
</head>
<body>
<div id="wrap">
  <div id="missing">
    <h1>Silkworm Revisited</h1>
    <p>The game data isn't unpacked yet. Run this once in the <code>remake</code>
       folder with your own copy of the disk:</p>
    <p><code>node build.js path/to/Silkworm.adf</code></p>
  </div>
  <div id="box"><canvas id="screen" width="320" height="200"></canvas><div id="crt"></div></div>
</div>
<script src="js/gamedata.js?v=24"></script>   <!-- made by build.js; absent in the repo -->
<script src="js/hints.js?v=24"></script>
<script src="js/data.js?v=24"></script>
<script src="js/gfx.js?v=24"></script>
<script src="js/input.js?v=24"></script>
<script src="js/sound.js?v=24"></script>
<script src="js/music.js?v=24"></script>
<script src="js/enemies.js?v=24"></script>
<script src="js/game.js?v=24"></script>
<script>
"use strict";
(function () {
  const canvas = document.getElementById("screen");

  function fit() {
    const s = Math.max(1, Math.floor(Math.min(innerWidth / 320, innerHeight / 200)));
    canvas.style.width = 320 * s + "px";
    canvas.style.height = 200 * s + "px";
    crt.style.backgroundSize = "100% " + s + "px";   // one line pair per Amiga row
  }
  const crt = document.getElementById("crt");
  try { if (localStorage.getItem("crt") === "1") crt.classList.add("on"); } catch (e) { /* no storage */ }
  addEventListener("keydown", (e) => {
    if (e.code !== "KeyC" || e.repeat) return;
    const on = crt.classList.toggle("on");
    try { localStorage.setItem("crt", on ? "1" : "0"); } catch (err) { /* no storage */ }
  });
  addEventListener("resize", fit);
  canvas.addEventListener("dblclick", () => document.documentElement.requestFullscreen && document.documentElement.requestFullscreen());

  function run(mem, blocks) {
    SW.gfx.init(blocks, mem);
    SW.sound.init(mem);
    SW.music.init(mem);
    addEventListener("keydown", () => SW.sound.unlock());
    addEventListener("pointerdown", () => SW.sound.unlock());
    const q = new URLSearchParams(location.search);
    SW.game.init(canvas, Number(q.get("level")) || 1, Number(q.get("t")) || 0, q.get("god") === "1");
    canvas.style.display = "block";
    fit();
    let last = performance.now(), acc = 0;
    const STEP = 20;   // 50 Hz, like the PAL original
    (function loop(now) {
      acc += Math.min(200, now - last); last = now;
      while (acc >= STEP) { SW.game.step(); acc -= STEP; }
      SW.game.draw();
      requestAnimationFrame(loop);
    })(last);
  }

  if (SW.gamedata) { const d = SW.data.load(SW.gamedata); run(d.mem, d.blocks); }
  else document.getElementById("missing").style.display = "block";
})();
</script>
</body>
</html>
